name: Bug report
description: Report a reproducible problem in the public template
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach API keys, `.env`, `config.local.yaml`, source documents,
        generated Markdown, database files, OAuth data, or unredacted logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use disposable sample data and redact local paths and identifiers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, WSL, Docker Desktop, Python and relevant component versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private documents, knowledge-base IDs and personal paths.
          required: true
