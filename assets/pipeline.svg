<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Question bank processing pipeline</title>
  <desc id="desc">Source files are parsed, paired, classified, indexed into three layers, and exposed through retrieval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#0f172a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="750">Source files to three-layer retrieval</text>
  <text x="60" y="96" fill="#64748b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">Existing components do the heavy lifting. The template keeps the steps recoverable.</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" filter="url(#cardShadow)">
    <g transform="translate(60 145)">
      <rect width="180" height="178" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="90" cy="50" r="27" fill="#e2e8f0"/>
      <path d="M78 35H96L105 44V67H78Z" fill="#64748b"/>
      <path d="M96 35V45H105" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <text x="90" y="104" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">SOURCE</text>
      <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="14">files · folders · archives</text>
      <text x="90" y="154" text-anchor="middle" fill="#64748b" font-size="14">questions + answers</text>
    </g>

    <g transform="translate(285 145)">
      <rect width="180" height="178" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <circle cx="90" cy="50" r="27" fill="#dbeafe"/>
      <path d="M74 55L84 65L107 38" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="104" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">PARSE</text>
      <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="14">MinerU Markdown</text>
      <text x="90" y="154" text-anchor="middle" fill="#64748b" font-size="14">MiMo figure notes</text>
    </g>

    <g transform="translate(510 145)">
      <rect width="180" height="178" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <circle cx="90" cy="50" r="27" fill="#dcfce7"/>
      <path d="M68 50H112M90 28V72" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
      <text x="90" y="104" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">STRUCTURE</text>
      <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="14">pair · classify</text>
      <text x="90" y="154" text-anchor="middle" fill="#64748b" font-size="14">preserve provenance</text>
    </g>

    <g transform="translate(735 145)">
      <rect width="180" height="178" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
      <circle cx="90" cy="50" r="27" fill="#ede9fe"/>
      <rect x="69" y="33" width="42" height="10" rx="4" fill="#7c3aed"/>
      <rect x="69" y="47" width="42" height="10" rx="4" fill="#8b5cf6"/>
      <rect x="69" y="61" width="42" height="10" rx="4" fill="#a78bfa"/>
      <text x="90" y="104" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">INDEX</text>
      <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="14">parent · child · raw</text>
      <text x="90" y="154" text-anchor="middle" fill="#64748b" font-size="14">WeKnora × 3</text>
    </g>

    <g transform="translate(960 145)">
      <rect width="180" height="178" rx="18" fill="#ffffff" stroke="#bae6fd"/>
      <circle cx="90" cy="50" r="27" fill="#e0f2fe"/>
      <circle cx="84" cy="46" r="13" fill="none" stroke="#0284c7" stroke-width="5"/>
      <path d="M94 56L108 70" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
      <text x="90" y="104" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">RETRIEVE</text>
      <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="14">vector + BM25</text>
      <text x="90" y="154" text-anchor="middle" fill="#64748b" font-size="14">optional ChatGPT MCP</text>
    </g>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 234H273"/>
    <path d="M265 226L274 234L265 242"/>
    <path d="M472 234H498"/>
    <path d="M490 226L499 234L490 242"/>
    <path d="M697 234H723"/>
    <path d="M715 226L724 234L715 242"/>
    <path d="M922 234H948"/>
    <path d="M940 226L949 234L940 242"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="60" y="354" width="1080" height="44" rx="12" fill="#0f172a"/>
    <text x="84" y="382" fill="#f8fafc">Resumable SQLite state</text>
    <text x="328" y="382" fill="#94a3b8">·</text>
    <text x="361" y="382" fill="#f8fafc">safe defaults</text>
    <text x="527" y="382" fill="#94a3b8">·</text>
    <text x="560" y="382" fill="#f8fafc">digest-bound cleanup</text>
    <text x="797" y="382" fill="#94a3b8">·</text>
    <text x="830" y="382" fill="#f8fafc">user-owned data and accounts</text>
  </g>
</svg>
