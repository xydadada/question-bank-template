<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MinerU to WeKnora question bank template</title>
  <desc id="desc">Documents pass through MinerU and Markdown into three WeKnora retrieval layers and ChatGPT.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="76" y="76" width="8" height="124" rx="4" fill="url(#accent)"/>

  <text x="116" y="125" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" letter-spacing="3">OPEN SOURCE TEMPLATE</text>
  <text x="112" y="213" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="68" font-weight="750">MinerU → WeKnora</text>
  <text x="114" y="267" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28">Question bank ingestion and retrieval</text>
  <text x="114" y="316" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">Parent records · child records · full Markdown · read-only MCP</text>

  <g transform="translate(112 397)" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="650">
    <g>
      <rect width="142" height="56" rx="28" fill="#13233a" stroke="#334155"/>
      <text x="71" y="35" fill="#e2e8f0" text-anchor="middle">MinerU</text>
    </g>
    <path d="M156 28H194" stroke="#64748b" stroke-width="3"/>
    <path d="M187 20L198 28L187 36" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(212)">
      <rect width="158" height="56" rx="28" fill="#13233a" stroke="#334155"/>
      <text x="79" y="35" fill="#e2e8f0" text-anchor="middle">Markdown</text>
    </g>
    <path d="M384 28H422" stroke="#64748b" stroke-width="3"/>
    <path d="M415 20L426 28L415 36" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(440)">
      <rect width="158" height="56" rx="28" fill="#123429" stroke="#22c55e"/>
      <text x="79" y="35" fill="#dcfce7" text-anchor="middle">WeKnora</text>
    </g>
    <path d="M612 28H650" stroke="#64748b" stroke-width="3"/>
    <path d="M643 20L654 28L643 36" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(668)">
      <rect width="158" height="56" rx="28" fill="#102c43" stroke="#38bdf8"/>
      <text x="79" y="35" fill="#e0f2fe" text-anchor="middle">ChatGPT</text>
    </g>
  </g>

  <g transform="translate(960 108)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="402" rx="28" fill="#111c2f" stroke="#334155"/>
    <g transform="translate(34 36)">
      <rect x="0" y="26" width="120" height="142" rx="12" fill="#e2e8f0" transform="rotate(-7 60 97)"/>
      <rect x="16" y="11" width="120" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M40 52H112M40 77H103M40 102H110" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="100" cy="126" r="15" fill="none" stroke="#22c55e" stroke-width="6"/>
      <path d="M88 136L72 152" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    </g>
    <path d="M135 206V232" stroke="#64748b" stroke-width="4"/>
    <path d="M126 224L135 236L144 224" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(40 247)" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">
      <rect width="190" height="34" rx="8" fill="#143628" stroke="#22c55e"/>
      <text x="18" y="23" fill="#dcfce7">PARENT</text>
      <rect y="45" width="190" height="34" rx="8" fill="#162d46" stroke="#38bdf8"/>
      <text x="18" y="68" fill="#e0f2fe">CHILD</text>
      <rect y="90" width="190" height="34" rx="8" fill="#26233f" stroke="#a78bfa"/>
      <text x="18" y="113" fill="#ede9fe">RAW</text>
    </g>
  </g>

  <text x="114" y="570" fill="#64748b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">Windows 11 · WSL2 · Docker · Ollama</text>
</svg>
