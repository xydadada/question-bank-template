version: 1

# Metadata and official runtime identifiers only. Model weights stay in the
# selected runtime and are never committed to this repository.
models:
  mineru-cloud-vlm:
    roles: [parser]
    runtime: mineru-cloud
    model: vlm
    local: false
    description: MinerU hosted VLM parser
    source_url: https://github.com/opendatalab/MinerU
  mineru-local-pipeline:
    roles: [parser]
    runtime: mineru-local
    backend: pipeline
    package: mineru[all]==3.4.4
    python: "3.12"
    minimum_ram_gb: 16
    minimum_disk_gb: 20
    local: true
    description: MinerU local CPU-friendly pipeline
    source_url: https://github.com/opendatalab/MinerU
  mineru-local-vlm:
    roles: [parser]
    runtime: mineru-local
    backend: vlm-auto-engine
    package: mineru[all]==3.4.4
    python: "3.12"
    minimum_ram_gb: 16
    minimum_disk_gb: 20
    minimum_vram_gb: 8
    local: true
    description: MinerU local VLM backend for CUDA machines
    source_url: https://github.com/opendatalab/MinerU
  rapidocr-local:
    roles: [ocr]
    runtime: python-extra
    extra: ocr
    local: true
    description: RapidOCR for inexpensive text-first recovery
    source_url: https://github.com/RapidAI/RapidOCR
  qwen3-0.6b:
    roles: [classification, chat]
    runtime: ollama
    model: qwen3:0.6b
    local: true
    approximate_download_gb: 0.52
    description: Small local text model
    source_url: https://ollama.com/library/qwen3
  qwen3-1.7b:
    roles: [classification, chat]
    runtime: ollama
    model: qwen3:1.7b
    local: true
    description: Small local text model with more capacity
    source_url: https://ollama.com/library/qwen3
  qwen3-4b:
    roles: [classification, chat]
    runtime: ollama
    model: qwen3:4b
    local: true
    description: Mid-size local text model
    source_url: https://ollama.com/library/qwen3
  qwen3-8b:
    roles: [classification, chat]
    runtime: ollama
    model: qwen3:8b
    local: true
    description: Larger local text model
    source_url: https://ollama.com/library/qwen3
  qwen3.5-0.8b:
    roles: [vision, classification, chat]
    runtime: ollama
    model: qwen3.5:0.8b
    local: true
    approximate_download_gb: 1.0
    description: Very small multimodal model
    source_url: https://ollama.com/library/qwen3.5
  qwen3.5-2b:
    roles: [vision, classification, chat]
    runtime: ollama
    model: qwen3.5:2b
    local: true
    approximate_download_gb: 2.7
    description: Balanced small multimodal model
    source_url: https://ollama.com/library/qwen3.5
  qwen3.5-4b:
    roles: [vision, classification, chat]
    runtime: ollama
    model: qwen3.5:4b
    local: true
    description: Higher-quality local multimodal model
    source_url: https://ollama.com/library/qwen3.5
  qwen3.5-9b:
    roles: [vision, classification, chat]
    runtime: ollama
    model: qwen3.5:9b
    local: true
    description: Larger multimodal model for higher-memory systems
    source_url: https://ollama.com/library/qwen3.5
  qwen3-vl-2b:
